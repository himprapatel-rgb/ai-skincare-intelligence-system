# Fly.io Configuration for Pellicura API - STAGING
# https://fly.io/docs/reference/configuration/

app = "pellicura-api-staging"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENV = "staging"
  DEBUG = "true"
  ALLOWED_ORIGINS = "[\"https://staging.pellicura.pages.dev\",\"https://pellicura.pages.dev\",\"https://pellicura.com\",\"http://localhost:3000\",\"http://localhost:5173\"]"
  ALLOWED_HOSTS = "[\"*\"]"
  FRONTEND_URL = "https://staging.pellicura.pages.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
