name: Deploy Backend to Production

# PRODUCTION DEPLOYS REQUIRE MANUAL APPROVAL
# Only runs when manually triggered from GitHub Actions UI
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

# DISABLED: Production backend now on Railway. See DEPLOYMENT_URLS.md.
jobs:
  deploy:
    name: Deploy to Fly.io Production (DISABLED - use Railway)
    runs-on: ubuntu-latest
    if: false  # Fly.io disabled; production on Railway
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Confirm deployment
        run: echo "🚀 Deploying to PRODUCTION with approval..."
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
