# DEPRECATED: Backend deploy uses railway.json at repo root (same Dockerfile; migrations and healthcheck are correct there).
# Keep this file only for reference; do not create a second Railway service from it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPaths = ["/backend/**"]

[deploy]
# Set UVICORN_WORKERS in Railway Variables if you want to override (default 16 for 32 vCPU)
startCommand = "python3 /app/backend/scripts/run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${UVICORN_WORKERS:-16}"
# Readiness: 200 only when DB is reachable; prevents traffic during migrations or DB issues
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
