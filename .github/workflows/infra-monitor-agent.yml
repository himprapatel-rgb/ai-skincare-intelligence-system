# Infrastructure Monitor Agent - Runs every 15 min, checks backend + frontend + DB health.
# On failure: creates GitHub Issue with diagnostics. Avoids duplicate issues.
# On recovery: closes the open issue automatically.
name: Infrastructure Monitor Agent (24/7)

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  BACKEND_URL: "https://ai-skincare-intelligence-system-production.up.railway.app"
  FRONTEND_URL: "https://pellicura.com"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Backend Health
        id: backend
        run: |
          status=$(curl -s -o /tmp/backend_response.txt -w "%{http_code}" --connect-timeout 15 --max-time 30 "$BACKEND_URL/api/health" || echo "000")
          body=$(cat /tmp/backend_response.txt 2>/dev/null || echo "no response")
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          if [ "$status" = "200" ]; then
            echo "result=healthy" >> $GITHUB_OUTPUT
          else
            echo "result=unhealthy" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check Frontend Health
        id: frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 "$FRONTEND_URL" || echo "000")
          echo "status=$status" >> $GITHUB_OUTPUT
          if [ "$status" = "200" ] || [ "$status" = "304" ]; then
            echo "result=healthy" >> $GITHUB_OUTPUT
          else
            echo "result=unhealthy" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check Backend API Endpoints
        id: api_check
        if: steps.backend.outputs.result == 'healthy'
        run: |
          failed_endpoints=""
          # Check key API routes
          for endpoint in "/api/health" "/api/v1/products" "/docs"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$BACKEND_URL$endpoint" || echo "000")
            if [ "$code" != "200" ] && [ "$code" != "307" ]; then
              failed_endpoints="$failed_endpoints $endpoint($code)"
            fi
          done
          if [ -z "$failed_endpoints" ]; then
            echo "result=all_passed" >> $GITHUB_OUTPUT
          else
            echo "result=some_failed" >> $GITHUB_OUTPUT
            echo "failed=$failed_endpoints" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check for existing open issue
        id: existing_issue
        if: steps.backend.outputs.result == 'unhealthy' || steps.frontend.outputs.result == 'unhealthy'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'infra-monitor',
              per_page: 1
            });
            if (issues.data.length > 0) {
              core.setOutput('exists', 'true');
              core.setOutput('issue_number', issues.data[0].number);
            } else {
              core.setOutput('exists', 'false');
            }

      - name: Create Issue on failure
        if: (steps.backend.outputs.result == 'unhealthy' || steps.frontend.outputs.result == 'unhealthy') && steps.existing_issue.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const backendStatus = '${{ steps.backend.outputs.status }}';
            const backendResult = '${{ steps.backend.outputs.result }}';
            const frontendStatus = '${{ steps.frontend.outputs.status }}';
            const frontendResult = '${{ steps.frontend.outputs.result }}';
            const title = `[Infra Monitor] Service down - ${new Date().toISOString().slice(0,16)}`;
            const body = `## Infrastructure Monitor Alert\n\n| Service | Status | HTTP Code |\n|---------|--------|-----------|\n| Backend | ${backendResult} | ${backendStatus} |\n| Frontend | ${frontendResult} | ${frontendStatus} |\n\n**Backend URL:** ${process.env.BACKEND_URL}/api/health\n**Frontend URL:** ${process.env.FRONTEND_URL}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Time:** ${new Date().toISOString()}\n\n### Action needed\n- Check Railway dashboard for deploy/crash logs\n- Verify DATABASE_URL and env vars are set\n- Check if a recent commit broke the build\n- Redeploy from Railway dashboard if needed`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['infra-monitor', 'bug', 'priority-high']
            });

      - name: Update existing issue with new failure
        if: (steps.backend.outputs.result == 'unhealthy' || steps.frontend.outputs.result == 'unhealthy') && steps.existing_issue.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.existing_issue.outputs.issue_number || 0 }},
              body: `Still down at ${new Date().toISOString()}\nBackend: ${{ steps.backend.outputs.status }} | Frontend: ${{ steps.frontend.outputs.status }}`
            });

      - name: Auto-close issue on recovery
        if: steps.backend.outputs.result == 'healthy' && steps.frontend.outputs.result == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'infra-monitor',
              per_page: 5
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `All services recovered at ${new Date().toISOString()}. Auto-closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
