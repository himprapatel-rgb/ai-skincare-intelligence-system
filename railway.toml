[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPaths = ["/backend/**"]

[deploy]
startCommand = "python3 /app/backend/scripts/run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
# healthcheckPath removed - can cause 502 if TrustedHost blocks healthcheck.railway.app
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
