# Improvement Agent – Daily design & architecture improvements.
# 1) eslint --fix → PR if changes
# 2) Creates "Improvement of the Day" Issue from backlog
name: Improvement Agent (Daily)

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint fix (frontend)
        id: lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint -- --fix || true
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create PR for lint fixes
        if: steps.lint.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          br="improvement/lint-fix-$(date +%Y%m%d-%H%M)"
          git checkout -b "$br"
          git add -A
          git commit -m "style: auto-fix lint (Improvement Agent)"
          git push origin "$br"
          gh pr create --base main --head "$br" \
            --title "Improvement Agent: Lint fixes" \
            --body "Auto-generated by Improvement Agent. Review and merge."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  improvement-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pick improvement of the day
        run: |
          node scripts/improvement-agent/pick.js > improvement.json

      - name: Create Improvement Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { title, body } = JSON.parse(fs.readFileSync('improvement.json', 'utf8'));
            const today = new Date().toISOString().slice(0, 10);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const todayIssue = issues.find(i => i.title.startsWith('Improvement:') && i.created_at.startsWith(today));
            if (todayIssue) {
              core.notice('Improvement Issue already created today, skipping');
              return;
            }
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.notice(`Created Improvement Issue #${data.number}`);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
