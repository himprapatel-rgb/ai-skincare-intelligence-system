# One-time: Add CNAME records in Cloudflare so pellicura.com points to Railway frontend.
# Run manually from GitHub Actions tab.
# Token needs: Zone:Read, Zone:DNS:Edit (Pages-only token won't work)
name: Set Cloudflare DNS for Railway

on:
  workflow_dispatch:
    inputs:
      zone_id:
        description: 'Zone ID (optional)'
        required: false
        type: string
      account_id:
        description: 'Account ID - used to find Zone ID if zone_id not provided'
        required: false
        type: string

jobs:
  set-dns:
    name: Add CNAME records for pellicura.com
    runs-on: ubuntu-latest
    steps:
      - name: Get Zone ID
        id: zone
        env:
          ZONE_ID_SECRET: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          zone_id="${{ github.event.inputs.zone_id }}"
          [ -z "$zone_id" ] && zone_id="$ZONE_ID_SECRET"
          account_id="${{ github.event.inputs.account_id }}"

          if [ -n "$zone_id" ]; then
            echo "Using provided Zone ID: $zone_id"
          else
            echo "Fetching zones (trying name=pellicura.com first, then all zones)..."
            resp=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=pellicura.com" \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json")
            if [ "$(echo "$resp" | jq '.result | length')" = "0" ] && [ -n "$account_id" ]; then
              resp=$(curl -s "https://api.cloudflare.com/client/v4/zones" \
                -H "Authorization: Bearer $token" -H "Content-Type: application/json")
            fi
            echo "API: $(echo "$resp" | jq -c 'if .success then {ok: true, count: (.result | length)} else {ok: false, errors} end')"
            zone_id=$(echo "$resp" | jq -r '.result[] | select(.name == "pellicura.com") | .id' | head -1)
            [ -z "$zone_id" ] && zone_id=$(echo "$resp" | jq -r '.result[0].id')
          fi

          if [ -z "$zone_id" ] || [ "$zone_id" = "null" ]; then
            echo "::error::Could not find zone. Try account_id input or zone_id. Token needs Zone:Read + Zone:DNS:Edit."
            exit 1
          fi
          echo "zone_id=$zone_id" >> $GITHUB_OUTPUT
          echo "Zone ID: $zone_id"

      - name: Remove existing @ and www records (if any)
        run: |
          zone="${{ steps.zone.outputs.zone_id }}"
          token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          for name in "pellicura.com" "www.pellicura.com"; do
            ids=$(curl -s "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$name" \
              -H "Authorization: Bearer $token" | jq -r '.result[].id')
            for id in $ids; do
              [ -n "$id" ] && curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$id" \
                -H "Authorization: Bearer $token" | jq '.success'
            done
          done

      - name: Add CNAME @ (root) → j62m06la.up.railway.app
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/dns_records" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "type": "CNAME",
              "name": "@",
              "content": "j62m06la.up.railway.app",
              "ttl": 1,
              "proxied": true
            }' | jq '.success, .errors, .result'

      - name: Add CNAME www → fcqgs166.up.railway.app
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/dns_records" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "type": "CNAME",
              "name": "www",
              "content": "fcqgs166.up.railway.app",
              "ttl": 1,
              "proxied": true
            }' | jq '.success, .errors, .result'
