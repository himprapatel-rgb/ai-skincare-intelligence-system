# Kept in sync with railway.json (repo root) so the backend deploys correctly
# regardless of which config the Railway service reads.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPaths = ["/backend/**"]

[deploy]
# run_migrations.py lives at /app/scripts (Dockerfile COPY scripts /app/scripts) and
# refuses to run without RUN_MIGRATIONS=true, so guard it with `|| true` and never let
# it block uvicorn. Worker count is overridable via UVICORN_WORKERS (default 4 to avoid
# OOM on smaller instances; raise it for larger plans).
startCommand = "(python3 /app/scripts/run_migrations.py || true) && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${UVICORN_WORKERS:-4}"
# Readiness: 200 only when DB is reachable; generous window for cold DB/instance starts.
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
