# One-time: push Google OAuth secrets from GitHub Secrets to Fly.io staging backend.
# Run this after adding GOOGLE_CLIENT_SECRET to GitHub Secrets (GOOGLE_CLIENT_ID is already there).
name: Set Fly.io Google Secrets (Staging)

on:
  workflow_dispatch:

jobs:
  set-secrets:
    name: Set Google OAuth secrets on Fly.io Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Google OAuth secrets on pellicura-api-staging
        run: |
          flyctl secrets set \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --app pellicura-api-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
